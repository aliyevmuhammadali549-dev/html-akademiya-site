<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML Akademiya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Montserrat:wght@800;900&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: friendly, energetic school for teens learning to code on a phone
   IDEA: a code editor that is also a classroom — every screen looks like a working IDE pane
   PICTURE: live editor + preview in the hero, typing itself
   COLOUR and TYPE: brand teal #375758 / mint accent on warm paper (light) or near-black (dark); Inter + JetBrains Mono
   LAYOUT: sticky top bar, hash-routed views, single column on phones */
:root{color-scheme:dark;--bg:#081410;--panel:#0f1c16;--panel2:#1F3128;--ink:#E8F2EC;--mute:#8FA89A;--line:rgba(166,247,207,.10);
--brand:#38F2A1;--brand-ink:#06140d;--mint2:#A6F7CF;--acc:#38F2A1;--ok:#38F2A1;--bad:#ff6b6b;--glow:rgba(56,242,161,.18)}
html.light{color-scheme:light;--bg:#EEF5F0;--panel:#ffffff;--panel2:#E2EDE6;--ink:#0b1a13;--mute:#55695e;--line:rgba(8,20,16,.10);--brand:#13b877;--brand-ink:#ffffff;--mint2:#0e8a5a;--acc:#13b877;--ok:#13a86c;--glow:rgba(19,184,119,.15)}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;transition:background .4s,color .4s;overflow-x:clip}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
code,pre,.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
code{background:var(--panel2);padding:1px 6px;border-radius:6px;font-size:.9em;overflow-wrap:anywhere}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(4vw,16px)}
.band{padding:clamp(28px,4vw,56px) 0}
h1,h2,h3{line-height:1.04;text-wrap:balance;margin:0 0 .4em;font-family:Montserrat,Manrope,Inter,sans-serif;letter-spacing:-.025em}
h1 .dim,h2 .dim{color:var(--mute);opacity:.75}
.pill{display:inline-block;background:#38F2A1;color:#06140d;border-radius:999px;padding:0 .32em .06em;line-height:1.1}
h1{font-size:clamp(34px,5vw,52px);font-weight:900;letter-spacing:-.02em}
h2{font-size:clamp(26px,3.4vw,36px);font-weight:800}
h3{font-size:19px;font-weight:700}
.muted{color:var(--mute)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:600;text-decoration:none}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.btn.pri{background:#38F2A1;color:#06140d;border-color:transparent;border-radius:999px}
.btn.ghost{border-radius:999px;background:transparent}
.btn.acc{background:#38F2A1;color:#06140d;border-color:transparent;border-radius:999px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px}
.tag{display:inline-block;font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--panel2);color:var(--mute)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.hidden{display:none!important}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:68px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px;text-decoration:none;margin-right:auto}
.logo i{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:#38F2A1;color:#06140d;font-style:normal;font-family:"JetBrains Mono",monospace;font-size:15px}
nav.main{display:flex;gap:4px;flex-wrap:wrap}
nav.main a{padding:8px 12px;border-radius:10px;text-decoration:none;font-weight:600;color:var(--mute)}
nav.main a.on,nav.main a:hover{color:var(--brand)}
nav.main a.on{position:relative}nav.main a.on:after{content:"";position:absolute;left:50%;bottom:0;width:5px;height:5px;border-radius:50%;background:var(--brand);transform:translateX(-50%)}
.tools{display:flex;align-items:center;gap:12px}
select.lang{min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);padding:0 8px;font-weight:600}
.userchip{display:flex;align-items:center;gap:8px;font-weight:700;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:4px 12px 4px 4px;min-height:40px}
.userchip b{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#38F2A1;color:#06140d}
.plan-badge{font-size:12px;padding:2px 8px;border-radius:99px;background:#38F2A1;color:#06140d;font-weight:700}
@media(max-width:1120px){nav.main{order:3;width:100%;overflow-x:auto;flex-wrap:nowrap;padding-bottom:8px}nav.main a{flex:none}}
.demo-note{font-size:13px;text-align:center;padding:6px 12px;background:var(--panel2);color:var(--mute)}
/* hero (Verda-style) */
.hero2{position:relative;text-align:center;padding:clamp(48px,7vw,96px) 0 40px}
.hero2:before{content:"";position:absolute;inset:-40px -10vw auto;height:520px;background:radial-gradient(50% 60% at 50% 30%,var(--glow),transparent 70%);pointer-events:none;z-index:-1}
.hero2 h1{font-size:clamp(38px,5.4vw,66px);font-weight:800;letter-spacing:-.03em;max-width:13ch;margin:0 auto .3em}
.hero2 .lead{font-size:18px;color:var(--mute);max-width:56ch;margin:0 auto 26px}
.hero2 .cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.plus{position:absolute;color:var(--mute);opacity:.5;font:300 26px/1 Inter}
.float{position:absolute;width:196px;text-align:left;padding:16px;border-radius:20px;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);box-shadow:0 30px 60px -30px rgba(0,0,0,.6);animation:bob 6s ease-in-out infinite}
.float .k{font-size:11px;letter-spacing:.08em;color:var(--mute);display:flex;gap:6px;align-items:center;text-transform:uppercase}
.float .k:before{content:"";width:7px;height:7px;border-radius:50%;background:#38F2A1}
.float b{display:block;font:800 34px/1.1 Manrope,sans-serif;margin:6px 0}
.float svg{width:100%;height:46px}
.float small{color:var(--brand);font-weight:700}
.f-l{left:-10px;top:200px;transform:rotate(-6deg)}.f-r{right:-10px;top:40px;transform:rotate(5deg);animation-delay:-3s}
@keyframes bob{50%{translate:0 -10px}}
@media(max-width:1180px){.float{display:none}}
.statbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:22px;background:var(--panel);margin-top:46px}
.statbar div{padding:20px 22px;border-left:1px solid var(--line);text-align:left}.statbar div:first-child{border-left:0}
.statbar b{display:block;font:800 30px/1.1 Manrope,sans-serif}.statbar span{font-size:12px;letter-spacing:.06em;color:var(--mute);text-transform:uppercase}
@media(max-width:700px){.statbar{grid-template-columns:1fr 1fr}.statbar div:nth-child(3){border-left:0}.statbar div:nth-child(n+3){border-top:1px solid var(--line)}}
.works{display:flex;justify-content:center;gap:clamp(18px,5vw,64px);flex-wrap:wrap;margin-top:34px;color:var(--mute);font:700 15px Manrope,sans-serif;opacity:.8}
.sec-h{text-align:center;max-width:720px;margin:0 auto 34px}.sec-h h2{font-size:clamp(30px,4.4vw,50px);letter-spacing:-.02em}.sec-h p{color:var(--mute)}
.fcard{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:10px}
.fcard .top2{display:flex;justify-content:space-between;align-items:center}
.fcard .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--panel2)}
.fcard .ic svg{width:20px;height:20px;stroke:var(--brand);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fcard .lab{font-size:11px;letter-spacing:.1em;color:var(--mute);text-transform:uppercase}
.fcard a{color:var(--brand);font-weight:700;text-decoration:none;font-size:14px;margin-top:auto}
.shot{border-radius:22px;overflow:hidden;border:1px solid var(--line);background:var(--panel);box-shadow:0 40px 80px -40px rgba(0,0,0,.7)}
.shot img{display:block;width:100%;height:auto}
.shots{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;align-items:start}
.shots .col{display:grid;gap:18px}
@media(max-width:800px){.shots{grid-template-columns:1fr}}
.ide{border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#06100c;box-shadow:0 30px 60px -30px rgba(0,0,0,.45)}
.ide .bar{display:flex;gap:6px;padding:12px 16px;background:#0c1914}
.ide .bar span{width:11px;height:11px;border-radius:50%;background:#ff5f57}.ide .bar span:nth-child(2){background:#febc2e}.ide .bar span:nth-child(3){background:#28c840}
.ide .split{display:grid;grid-template-columns:1fr 1fr;min-height:300px}
.ide pre{margin:0;padding:18px;color:#cfeee0;font-size:14px;white-space:pre-wrap;line-height:1.65}
.ide .caret{display:inline-block;width:8px;height:1.1em;background:#38F2A1;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ide .live{background:#fff;color:#111;padding:14px;overflow:auto}
@media(max-width:600px){.ide .split{grid-template-columns:1fr}.ide .live{min-height:180px}}

/* ===== v3 layout: hero with phone, row-style plans, calculator, FAQ, auth page ===== */
.hero3{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding:clamp(40px,6vw,80px) 0 30px;position:relative}
.hero3:before{content:"";position:absolute;inset:-60px -20vw auto;height:640px;background:radial-gradient(40% 55% at 75% 40%,var(--glow),transparent 70%),radial-gradient(35% 45% at 10% 70%,rgba(56,242,161,.08),transparent 70%);pointer-events:none;z-index:-1}
.hero3 h1{font-size:clamp(40px,6.4vw,84px);font-weight:900;line-height:.98;margin:.25em 0 .35em}
.hero3 .lead{font-size:18px;color:var(--mute);max-width:52ch;margin:0 0 28px}
.badge{display:inline-flex;align-items:center;gap:10px;font-weight:700;color:var(--brand)}
.badge i{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--panel2);font-style:normal;box-shadow:0 0 0 1px var(--line),0 10px 30px -10px var(--glow)}
.cta3{display:flex;gap:14px;flex-wrap:wrap}
.btn.big{min-height:56px;padding:0 28px;font-size:17px;font-weight:800;border-radius:16px}
.btn.pri.big{box-shadow:0 14px 34px -12px rgba(56,242,161,.6)}
.phone-wrap{position:relative;display:grid;place-items:center;min-height:560px}
.phone{width:290px;height:580px;border-radius:46px;background:#050a08;border:10px solid #1a2420;box-shadow:0 40px 90px -30px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.06),inset 0 0 0 1px rgba(255,255,255,.04);padding:16px 14px;color:#E8F2EC;position:relative;overflow:hidden;transform:rotate(-2deg)}
.phone:before{content:"";position:absolute;top:10px;left:50%;width:90px;height:24px;border-radius:14px;background:#000;transform:translateX(-50%)}
.phone .sb{display:flex;justify-content:space-between;font-size:12px;font-weight:700;padding:2px 10px 18px}
.phone small{color:#8FA89A;font-size:11px}
.phone h4{margin:2px 0 12px;font:800 18px Montserrat,sans-serif}
.phone .pc{background:#0f1c16;border:1px solid rgba(166,247,207,.1);border-radius:16px;padding:12px;margin-bottom:10px}
.phone .chips2{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.phone .chips2 span{font-size:11px;padding:4px 9px;border-radius:9px;background:#1F3128;color:#cfe3da}
.phone .chips2 span.on{background:transparent;border:1px solid #38F2A1;color:#38F2A1}
.phone .bar2{height:8px;border-radius:9px;background:#1F3128;overflow:hidden;margin-top:8px}.phone .bar2 i{display:block;height:100%;background:#38F2A1}
.phone pre{margin:6px 0 0;font-size:11px;color:#a8e6c9;white-space:pre-wrap}
.phone .go{display:block;text-align:center;background:#38F2A1;color:#06140d;font-weight:800;font-size:13px;border-radius:12px;padding:11px;margin-top:6px;box-shadow:0 10px 24px -10px rgba(56,242,161,.7)}
.phone .nav2{position:absolute;left:14px;right:14px;bottom:16px;display:flex;justify-content:space-around;background:#0f1c16;border-radius:16px;padding:10px;font-size:15px;opacity:.85}
.fl{position:absolute;display:flex;gap:12px;align-items:center;padding:14px 18px;border-radius:18px;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);box-shadow:0 30px 60px -30px rgba(0,0,0,.7);backdrop-filter:blur(8px);max-width:270px;animation:bob 6s ease-in-out infinite}
.fl b{display:block;font:800 15px Montserrat,sans-serif}.fl span{font-size:13px;color:var(--mute)}
.fl .ico2{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:#38F2A1;color:#06140d;font-weight:900}
.fl.a{left:-40px;top:300px;transform:rotate(-5deg)}.fl.b{right:-70px;top:150px;transform:rotate(4deg);animation-delay:-3s}
.scrollhint{display:grid;place-items:center;margin:10px auto 0;width:26px;height:42px;border:2px solid var(--line);border-radius:14px}
.scrollhint:after{content:"";width:4px;height:9px;border-radius:3px;background:var(--mute);animation:wheel 1.6s infinite}
@keyframes wheel{0%{transform:translateY(-6px);opacity:1}100%{transform:translateY(8px);opacity:0}}
@media(max-width:900px){.hero3{grid-template-columns:1fr}.phone-wrap{min-height:520px}.fl{display:none}}
.eyebrow{display:block;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);margin-bottom:10px}
.h2big{font-size:clamp(32px,4.6vw,58px);font-weight:900;line-height:1}
.plans2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;margin-top:30px}
.plan2{position:relative;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:24px}
.plan2.pop{background:linear-gradient(160deg,color-mix(in srgb,#38F2A1 10%,var(--panel)),var(--panel) 55%);border-color:color-mix(in srgb,#38F2A1 45%,transparent)}
.plan2 .pi{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:var(--panel2);font-size:22px;margin-bottom:14px}
.plan2.pop .pi{background:#38F2A1;color:#06140d}
.plan2 h3{font:800 20px Montserrat,sans-serif;margin:0}
.plan2 .pr{font:900 clamp(30px,3.4vw,38px)/1.1 Montserrat,sans-serif;margin:8px 0 2px;white-space:nowrap}.plan2 .pr small{font:700 14px Inter,sans-serif;color:var(--mute)}
.plan2 .ribbon2{position:absolute;top:20px;right:20px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:#38F2A1;color:#06140d;padding:6px 10px;border-radius:99px}
.plan2 .row{padding:14px 0;border-top:1px solid var(--line)}
.plan2 .row:first-of-type{margin-top:14px}
.plan2 .row small{display:block;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
.plan2 .row b{font-weight:700}.plan2 .row b.no{color:var(--mute);font-weight:500}
.plan2 .btn{margin-top:auto;width:100%;min-height:52px;border-radius:16px;font-weight:800}
.plan2 .sp{flex:1;min-height:18px}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}
@media(max-width:860px){.calc{grid-template-columns:1fr}}
.perk{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:10px}
.perk i{flex:none;display:grid;place-items:center;width:42px;height:42px;border-radius:12px;font-style:normal;font-size:20px;background:var(--panel2)}
.perk b{display:block}.perk span{font-size:14px;color:var(--mute)}
.calcbox{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 40px 80px -50px var(--glow)}
.calcbox .big2{font:900 clamp(40px,5vw,56px)/1 Montserrat,sans-serif;margin:6px 0 2px}
.calcbox input[type=range]{width:100%;accent-color:#38F2A1;height:28px;margin:14px 0}
.calcbox .ln{display:flex;justify-content:space-between;gap:10px;padding:14px 0;border-top:1px solid var(--line);font-weight:700}
.calcbox .ln .v{font:900 26px Montserrat,sans-serif;color:var(--brand)}
.faq{display:grid;grid-template-columns:.8fr 1.2fr;gap:30px}
@media(max-width:860px){.faq{grid-template-columns:1fr}}
.faq details{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:4px 18px;margin-bottom:10px}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;min-height:56px;font-weight:800}
.faq summary::-webkit-details-marker{display:none}
.faq summary:after{content:"+";flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--panel2);font-size:20px;transition:transform .2s}
.faq details[open] summary:after{transform:rotate(45deg)}
.faq details p{margin:0 0 16px;color:var(--mute)}
/* auth page */
body.authmode header.top,body.authmode footer,body.authmode .demo-note{display:none}
body.authmode #view{max-width:none;padding:0}
.auth{display:grid;grid-template-columns:1fr 1fr;min-height:100vh;gap:24px;padding:16px}
@media(max-width:900px){.auth{grid-template-columns:1fr}.auth .art{display:none}}
.art{position:relative;border-radius:30px;overflow:hidden;background:radial-gradient(70% 60% at 30% 20%,#1f5a45,transparent 70%),linear-gradient(160deg,#0f3d2e,#081410 80%);display:grid;place-items:center;min-height:560px}
.art .grid-dots{position:absolute;inset:0;background-image:radial-gradient(rgba(166,247,207,.14) 1px,transparent 1px);background-size:26px 26px}
.art .obj{position:absolute;font-size:clamp(44px,5vw,70px);filter:drop-shadow(0 18px 24px rgba(0,0,0,.45));animation:bob 7s ease-in-out infinite}
.art .bub{position:absolute;padding:10px 16px;border-radius:16px;font:800 18px Montserrat,sans-serif;color:#06140d;box-shadow:0 16px 30px -12px rgba(0,0,0,.5);animation:bob 6s ease-in-out infinite}
.art .lc{position:relative;z-index:2;display:flex;gap:16px;align-items:center;padding:26px 32px;border-radius:26px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px)}
.art .lc i{display:grid;place-items:center;width:66px;height:66px;border-radius:18px;background:#38F2A1;color:#06140d;font:900 22px "JetBrains Mono",monospace;font-style:normal}
.art .lc b{display:block;font:900 32px/1 Montserrat,sans-serif;color:#fff}.art .lc small{color:#A6F7CF;font-weight:800;letter-spacing:.16em;font-size:12px}
.art .quote{position:absolute;bottom:22%;left:0;right:0;text-align:center;color:#E8F2EC;font:800 22px Montserrat,sans-serif;z-index:2}
.aside{position:relative;display:grid;place-items:center;padding:60px 10px 30px}
.aside .tl{position:absolute;top:10px;right:10px;display:flex;gap:10px;align-items:center}
.acard{width:min(470px,100%);background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:26px;box-shadow:0 40px 90px -50px rgba(0,0,0,.8)}
.acard h2{font:900 clamp(26px,3vw,34px)/1.1 Montserrat,sans-serif;margin:18px 0 18px}
.tabs2{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px;border-radius:18px;background:var(--bg);border:1px solid var(--line)}
.tabs2 button{min-height:48px;border:0;border-radius:13px;background:transparent;font-weight:800;color:var(--mute);cursor:pointer}
.tabs2 button.on{background:var(--panel2);color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.fld{display:grid;gap:8px;margin-bottom:16px}.fld>span{display:flex;justify-content:space-between;font-weight:800;font-size:14px}
.fld a{color:var(--brand);font-weight:700;text-decoration:none;cursor:pointer}
.inp{display:flex;align-items:center;gap:10px;min-height:56px;padding:0 16px;border-radius:16px;border:1px solid var(--line);background:var(--bg);transition:border-color .2s}
.inp:focus-within{border-color:#38F2A1}
.inp input{flex:1;border:0;background:transparent;outline:none;font-size:16px;min-height:50px}
.inp .pre{font-weight:800}.inp .ey{border:0;background:transparent;cursor:pointer;font-size:18px;color:var(--mute);min-width:32px;min-height:32px}
.strength{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:-6px 0 14px}.strength i{height:4px;border-radius:3px;background:var(--panel2)}
.strength i.on1{background:#ff6b6b}.strength i.on2{background:#f5b041}.strength i.on3{background:#38F2A1}
.chk{display:flex;gap:10px;align-items:center;font-size:14px;margin:4px 0 16px}.chk input{width:20px;height:20px;accent-color:#38F2A1}
.abtn{width:100%;min-height:58px;border:0;border-radius:16px;background:#38F2A1;color:#06140d;font:800 17px Inter,sans-serif;cursor:pointer;box-shadow:0 14px 30px -12px rgba(56,242,161,.6);transition:transform .15s}
.abtn:active{transform:translateY(2px)}
.aerr{min-height:20px;color:var(--bad);font-weight:700;font-size:14px;margin:-6px 0 8px}
.alt{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;margin-top:12px;padding:0 14px;border-radius:16px;border:1px solid var(--line);background:transparent;font-weight:800;cursor:pointer;text-align:left;text-decoration:none}
.alt .dots{display:flex}.alt .dots span{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;margin-left:-6px;border:2px solid var(--panel);font-size:14px}
.alt .go2{margin-left:auto;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#38F2A1;color:#06140d}
.alt.green{background:color-mix(in srgb,#38F2A1 10%,transparent);border-color:color-mix(in srgb,#38F2A1 40%,transparent)}
.alt.green small{display:block;color:var(--mute);font-weight:600}.alt.green b{color:var(--brand)}
.sbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;border-radius:14px;font-weight:800;border:0;cursor:pointer;margin-bottom:10px;text-decoration:none}
.sbtn.tg{background:#2aa3e0;color:#fff}.sbtn.gg{background:#fff;color:#111;border:1px solid #ddd}
.or{display:flex;align-items:center;gap:12px;color:var(--mute);font-size:13px;margin:12px 0 16px}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.terms{font-size:12px;color:var(--mute);text-align:center;margin-top:16px}
.back3{display:inline-flex;gap:8px;align-items:center;min-height:42px;padding:0 16px;border-radius:99px;border:1px solid var(--line);font-weight:800;text-decoration:none}

.phone .go{text-decoration:none}
/* lessons */
.tabs{display:flex;gap:8px;margin:14px 0 22px;flex-wrap:wrap}
.tabs button{min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:700;cursor:pointer}
.tabs button.on{background:#38F2A1;color:#06140d;border-color:transparent}
.level{margin-bottom:22px}
.level h3{font-size:15px;color:var(--mute);font-weight:700}
.lrow{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
.lcard{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--panel);cursor:pointer;text-align:left;min-height:64px}
.lcard .num{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:800;background:var(--panel2)}
.lcard.done .num{background:var(--ok);color:#fff}
.lcard.locked{opacity:.55}
.lcard small{display:block;color:var(--mute);font-size:13px}
.progress{height:10px;border-radius:99px;background:var(--panel2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--brand);border-radius:99px}
/* lesson */
.lesson{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;align-items:start}
@media(max-width:900px){.lesson{grid-template-columns:1fr}}
.theory p{margin:.6em 0}
.example pre{background:#0f1515;color:#cfe3e1;padding:14px;border-radius:12px;margin:0;font-size:13.5px;white-space:pre-wrap}
.editor{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#0f1515}
.editor textarea{display:block;width:100%;min-height:230px;border:0;resize:vertical;background:#0f1515;color:#e3f0ee;padding:14px;font:14px/1.6 "JetBrains Mono",monospace;tab-size:2;outline:none}

.preview{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;height:220px}
.preview iframe{width:100%;height:100%;border:0}
.checks{list-style:none;padding:0;margin:12px 0}
.checks li{padding:8px 12px;border-radius:10px;margin-bottom:6px;background:var(--panel2)}
.checks li.ok{color:var(--ok)}.checks li.bad{color:var(--bad)}
.quiz .q{margin-bottom:18px}
.quiz label{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin:6px 0;cursor:pointer;min-height:44px}
.quiz label.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.quiz label.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.quiz .ex{font-size:14px;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.3)}
/* video */
.vcard{cursor:pointer;padding:0;overflow:hidden;text-align:left;border:1px solid var(--line)}
.vthumb{aspect-ratio:16/9;background:linear-gradient(135deg,#173131,#0f1515);display:grid;place-items:center;position:relative;color:#9fd1cf;font-family:"JetBrains Mono",monospace;font-size:13px;padding:14px}

.player iframe{width:100%;height:100%;min-height:220px;border:0;background:#fff}
.sub{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--panel2);min-height:52px}
/* AI */
.chat{display:flex;flex-direction:column;gap:10px;min-height:340px;max-height:60vh;overflow-y:auto;padding:4px}
.msg{max-width:85%;padding:12px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:#38F2A1;color:#06140d;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--panel2);border-bottom-left-radius:4px}
.chatform{display:flex;gap:10px;margin-top:12px}
.chatform textarea{flex:1;min-height:48px;max-height:160px;border-radius:12px;border:1px solid var(--line);background:var(--panel);padding:12px;font-size:16px;resize:vertical}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chips button{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:8px 14px;cursor:pointer;min-height:40px}
/* pricing */
.plans{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));align-items:stretch}
.plan{display:flex;flex-direction:column;gap:12px;position:relative}

.plan .price{font-size:34px;font-weight:900;white-space:nowrap}
.plan .price small{font-size:15px;color:var(--mute);font-weight:600}
.plan ul{list-style:none;padding:0;margin:0;display:grid;gap:8px;flex:1}
.plan li{padding-left:28px;position:relative}
.plan li:before{content:"";position:absolute;left:0;top:3px;width:18px;height:18px;border-radius:50%;background:color-mix(in srgb,var(--ok) 18%,transparent)}
.plan li:after{content:"";position:absolute;left:6px;top:7px;width:5px;height:9px;border:solid var(--ok);border-width:0 2px 2px 0;transform:rotate(45deg)}
.plan li.no{color:var(--mute);text-decoration:line-through}
.plan li.no:before{background:var(--panel2)}.plan li.no:after{display:none}
.plan .ribbon{position:absolute;top:-12px;right:18px;background:#38F2A1;color:#06140d;font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px}
.paylogos{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.paylogos span{font-weight:800;font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(5,10,10,.62);display:grid;place-items:center;padding:16px;overflow-y:auto}
.modal .box{position:relative;max-width:100%}
.modal .x{position:absolute;top:-6px;right:-6px;z-index:5;width:40px;height:40px;border-radius:50%;border:0;background:#fff;color:#111;font-size:22px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.profile-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.profile-grid .card b{display:block;font-size:30px;font-weight:900}
footer{border-top:1px solid var(--line);padding:26px 0;color:var(--mute);font-size:14px}

/* ---------- code checker (port of the bot's server checker) ---------- */
const BOOL=new Set(["required","controls","checked","disabled","multiple","autoplay","loop","muted","open","selected"]);
const decls=b=>{const o={};b.split(";").forEach(d=>{const i=d.indexOf(":");if(i>0)o[d.slice(0,i).trim().toLowerCase()]=d.slice(i+1).replace("!important","").trim().toLowerCase()});return o};
function parseCss(css){const r=[];css=css.replace(/\/\*[\s\S]*?\*\//g,"");for(const m of css.matchAll(/([^{}]+)\{([^{}]*)\}/g)){const d=decls(m[2]);m[1].split(",").forEach(s=>{if(s.trim())r.push([s.trim().toLowerCase(),d])})}return r}
function selHits(sel,target){const last=sel.trim().split(/\s*[>+~]\s*|\s+/).pop();const e=target.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");return new RegExp((/^[.#]/.test(target)?"":"(?<![\\w.#-])")+e+"(?![\\w-])").test(last)}
function propOk(d,p,v){for(const k in d){if(p==="border"&&k==="border-radius")continue;if((k===p||k.startsWith(p+"-"))&&d[k]&&(v==null||d[k].includes(v)))return true}return false}
function runChecks(code,rules){
 const doc=new DOMParser().parseFromString(code,"text/html");const css=parseCss([...doc.querySelectorAll("style")].map(s=>s.textContent).join("\n"));
 const sq=s=>s.replace(/\s+/g,"").toLowerCase();
 return rules.map(r=>{let ok=false;try{const q=r.q;
  if(r.t==="text")ok=[...doc.querySelectorAll(q)].some(e=>e.textContent.trim());
  else if(r.t==="el")ok=!!doc.querySelector(q);
  else if(r.t==="count")ok=doc.querySelectorAll(q).length>=r.n;
  else if(r.t==="attr")ok=[...doc.querySelectorAll(q)].some(e=>{const v=(e.getAttribute(r.a)||"").trim();return"v"in r?v.toLowerCase()===r.v:e.hasAttribute(r.a)&&(v||BOOL.has(r.a))});
  else if(r.t==="css")ok=css.some(([s,d])=>selHits(s,q)&&propOk(d,r.p,r.v))||[...doc.querySelectorAll(q)].some(e=>propOk(decls(e.getAttribute("style")||""),r.p,r.v));
  else if(r.t==="src")ok=sq(code).includes(sq(r.s));
 }catch(e){ok=false}return{ok,msg:tr(r.m)}})}

const VOID=new Set(["br","hr","img","input","meta","link","source","area","col","wbr"]);
function setupEditor(ta,onChange){
 ta.addEventListener("keydown",e=>{
  if(e.key==="Tab"){e.preventDefault();const p=ta.selectionStart,v=ta.value,before=v.slice(0,p),m=before.match(/(^|[\s>])([a-z][a-z0-9]*)$/i);
   let ins="  ",caret=2,cut=0;
   if(before.endsWith("!")){cut=1;ins='<!DOCTYPE html>\n<html>\n<head>\n  <title>Sahifa</title>\n</head>\n<body>\n  \n</body>\n</html>';caret=ins.indexOf("  \n</body>")+2}
   else if(m){const tag=m[2].toLowerCase();cut=tag.length;ins=VOID.has(tag)?"<"+tag+">":"<"+tag+"></"+tag+">";caret=VOID.has(tag)?ins.length:tag.length+2}
   ta.value=v.slice(0,p-cut)+ins+v.slice(ta.selectionEnd);ta.selectionStart=ta.selectionEnd=p-cut+caret;onChange()}
  else if(e.key===">"){const p=ta.selectionStart,before=ta.value.slice(0,p),m=before.match(/<([a-z][a-z0-9]*)(\s[^<>]*)?$/i);
   if(m&&!VOID.has(m[1].toLowerCase())){e.preventDefault();const c="></"+m[1]+">";ta.value=before+c+ta.value.slice(ta.selectionEnd);ta.selectionStart=ta.selectionEnd=p+1;onChange()}}});
 ta.addEventListener("input",onChange)}

 const i=VIDEOS().findIndex(l=>l.id===id),L=VIDEOS()[i],v=YT[id][S.lang];if(i>=plan().videos){toast(t("lockPlan",{p:"Premium"}));location.hash="pricing";return}
 openModal(`<div class="card" style="width:min(960px,92vw)"><h3>${esc(tr(L.title))}</h3>
  <div style="position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000"><iframe id="ytFrame" src="https://www.youtube-nocookie.com/embed/${v}?rel=0&hl=${S.lang}" title="YouTube" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="position:absolute;inset:0;width:100%;height:100%;border:0"></iframe></div>
  <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap"><a class="btn" href="https://www.youtube.com/watch?v=${v}" target="_blank" rel="noopener">YouTube ↗</a><a class="btn pri" href="#lesson-${L.id}" id="vGo">${t("start")} →</a></div></div>`);
 $("#vGo").onclick=closeModal}

/* ---------- AI tutor ---------- */
const cap=n=>(window.claude&&window.claude.use)?window.claude.use(n).catch(()=>null):Promise.resolve(null);
function vAi(){const lim=plan().ai,left=Math.max(0,lim-dayCount("ai"));
 if(!S.aiMsgs.length)S.aiMsgs=[{role:"assistant",content:t("aiHello")}];
 return `<section class="band" style="max-width:820px"><h1>${t("aiTitle")}</h1><p class="muted">${t("aiLead")}</p>
 <div class="card"><div class="chat" id="chat"></div><div class="chips">${["c1","c2","c3"].map(c=>`<button data-chip="${c}">${esc(t(c))}</button>`).join("")}</div>
 <form class="chatform" id="chatForm"><textarea id="aiIn" placeholder="${t("aiPh")}" aria-label="${t("aiPh")}"></textarea><button class="btn pri">${t("send")}</button></form>
 <div class="muted" style="font-size:13px;margin-top:8px" id="aiLeft">${lim>1e6?"∞":t("left",{n:left})}</div></div></section>`}
function drawChat(){const c=$("#chat");if(!c)return;c.innerHTML=S.aiMsgs.map(m=>`<div class="msg ${m.role==="user"?"me":"ai"}">${esc(m.content)}</div>`).join("");c.scrollTop=c.scrollHeight}
function bindAi(){drawChat();const inp=$("#aiIn");if(S.aiPrefill){inp.value=S.aiPrefill;S.aiPrefill=null}
 document.querySelectorAll("[data-chip]").forEach(b=>b.onclick=()=>{inp.value=t(b.dataset.chip);$("#chatForm").requestSubmit()});
 $("#chatForm").addEventListener("submit",async e=>{e.preventDefault();const q=inp.value.trim();if(!q)return;
  const lim=plan().ai;if(dayCount("ai")>=lim){toast(t("aiLimit",{n:lim}));location.hash="pricing";return}
  const sample=await cap("sample");
  inp.value="";S.aiMsgs.push({role:"user",content:q});const ans={role:"assistant",content:"…"};S.aiMsgs.push(ans);drawChat();bump("ai");
  const langName={uz:"Uzbek (Latin script)",ru:"Russian",en:"English"}[S.lang];
  const sys=`You are the AI tutor of "HTML Akademiya", a course that teaches HTML and CSS to beginners (mostly teenagers in Uzbekistan) on their phones. Always reply in ${langName}. Be friendly and short (under 150 words), explain in plain words, give a tiny code example when it helps, and never write the full solution of a course task unless the student asks for it twice — guide them with hints first. If the question is not about web development, gently bring the student back to HTML/CSS.`;
  const hist=S.aiMsgs.slice(1,-1).slice(-10);hist[0]={role:"user",content:sys+"\n\nStudent: "+hist[0].content};
  try{if(sample){const r=await sample(hist,{cache:false,modelTier:"quick",onText:({text})=>{ans.content=text;drawChat()}});ans.content=r.text}
   else{const r=await fetch("/api/ai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({lang:S.lang,messages:S.aiMsgs.slice(1,-1).slice(-10)})});
    const j=await r.json().catch(()=>({}));ans.content=r.ok&&j.text?j.text:(r.status===404?t("aiOff"):t("aiErr"))}}
  catch(err){ans.content=err&&err.code==="not_granted"?t("aiOff"):t("aiErr")}
  drawChat();const l=$("#aiLeft");if(l&&lim<1e6)l.textContent=t("left",{n:Math.max(0,lim-dayCount("ai"))})})}

/* ---------- pricing ---------- */
function vPricing(){const cur=S.user?.plan||"free",labels=[t("rL"),t("rD"),t("rV"),t("rA"),t("rC")],ico={free:"👤",premium:"⭐",alpha:"🚀"};
 const card=k=>{const P=PLANS[k];const price=k==="free"?t("free"):(S.lang==="en"?"$"+P.usd:fmtUZS(P.uzs));
  return `<div class="plan2 ${k==="premium"?"pop":""}">${k==="premium"?`<span class="ribbon2">${t("popular")}</span>`:""}<span class="pi">${ico[k]}</span><h3>${P.name}</h3>
  <div class="pr">${price}${k!=="free"?` <small>/ ${t("perMonth").replace("/","")}</small>`:""}</div>${k!=="free"?`<span class="muted" style="font-size:14px">${S.lang==="en"?"≈ "+fmtUZS(P.uzs):"≈ $"+P.usd}</span>`:""}
  ${t("pv")[k].map((v,i)=>`<div class="row"><small>${labels[i]}</small><b class="${v==="—"?"no":""}">${esc(v)}</b></div>`).join("")}<div class="sp"></div>
  ${cur===k&&k!=="free"?`<button class="btn" disabled>${t("current")}</button>`:k==="free"?`<a class="btn ghost" href="#lessons">${t("freeStart")}</a>`:`<a class="btn pri" target="_blank" rel="noopener" href="https://t.me/lowgx?text=${encodeURIComponent(t("tgMsg",{p:P.name}))}">${t("tgChoose")} ↗</a>`}</div>`};
 return `<section class="band"><span class="eyebrow">${t("plK")}</span><h1 class="h2big">${t("plA")}<br><span class="dim">${t("plB")}</span></h1>
 <div class="plans2">${card("free")}${card("premium")}${card("alpha")}</div>
 <p class="muted" style="margin-top:22px">${t("tgNote")}</p><h3 style="margin-top:20px">${t("payMethods")}</h3><div class="paylogos"><span>VISA</span><span>Mastercard</span><span>Uzcard</span><span>HUMO</span></div></section>`}

function vProfile(){if(!S.user){setTimeout(signin);return vHome()}const doneN=LESSONS.filter(l=>S.prog[l.id]?.done).length;
 return `<section class="band"><h1>${t("profile")}</h1><p class="muted">${esc(S.user.name)} · ${esc(S.user.email)}</p>
 <div class="profile-grid"><div class="card"><span class="muted">${t("plan")}</span><b>${PLANS[S.user.plan].name}</b></div><div class="card"><span class="muted">${t("xp")}</span><b>${S.xp}</b></div><div class="card"><span class="muted">${t("streak")}</span><b>🔥 ${S.streak}</b></div><div class="card"><span class="muted">${t("completed")}</span><b>${doneN}/60</b></div></div>
 <div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap">${S.user.plan!=="alpha"?`<a class="btn pri" href="#pricing">${t("upgrade")}</a>`:""}<button class="btn" id="doLogout">${t("logout")}</button></div></section>`}

/* ---------- router ---------- */
function route(){if(!$("#modal").classList.contains("hidden"))closeModal();document.body.classList.remove("authmode");const h=location.hash.slice(1)||"home";const v=$("#view");let html,after;
 const m=h.match(/^lesson-(\d+)$/);
 if(m){html=vLesson(+m[1]);after=()=>bindLesson(+m[1])}
 else if(h==="lessons")html=vLessons();else if(h==="videos")html=vVideos();
 else if(h==="ai"){html=vAi();after=bindAi}else if(h==="pricing")html=vPricing();
 else if(h==="profile"){html=vProfile();after=()=>{const b=$("#doLogout");if(b)b.onclick=()=>{S.user=null;store.set("user",null);paintStatic();location.hash="home"}}}
 else if(h==="login"||h==="signup"||h==="try"){html=vAuth(h);after=()=>bindAuth(h)}
 else{html=vHome();after=bindHome}
 if(html==="")return;v.innerHTML=html;after&&after();
 document.querySelectorAll("nav.main a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+(m?"lessons":h)));scrollTo(0,0)}
addEventListener("hashchange",route);
$("#view").addEventListener("click",e=>{const b=e.target.closest("[data-course],[data-lesson],[data-video]");if(!b)return;
 if(b.dataset.course){S.course=b.dataset.course;route()}
 else if(b.dataset.lesson){const L=LESSONS.find(l=>l.id===+b.dataset.lesson),a=access(L);if(!a.ok&&!S.prog[L.id]?.done){toast(a.msg);if(L.id>plan().maxLesson)setTimeout(()=>location.hash="pricing",900)}else location.hash="lesson-"+L.id}
 else if(b.dataset.video)playVideo(+b.dataset.video);
});

applyTheme();paintStatic();
fetch("lessons.json").then(r=>r.json()).then(d=>{LESSONS=d;route()}).catch(()=>{$("#view").innerHTML='<section class="band"><h2>Error loading lessons</h2></section>'})
 .finally(()=>{const wait=Math.max(0,2000-(performance.now()-T0));setTimeout(()=>{const b=$("#boot");b.style.opacity=0;setTimeout(()=>b.remove(),450)},wait)});
}
</script>
</body>
</html>
