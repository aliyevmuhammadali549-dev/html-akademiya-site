<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML Akademiya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=Geist+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: friendly, energetic school for teens learning to code on a phone
   IDEA: a code editor that is also a classroom — every screen looks like a working IDE pane
   PICTURE: live editor + preview in the hero, typing itself
   COLOUR and TYPE: brand teal #375758 / mint accent on warm paper (light) or near-black (dark); Inter + JetBrains Mono
   LAYOUT: sticky top bar, hash-routed views, single column on phones */
:root{color-scheme:dark;--bg:#0A0E0C;--panel:#111714;--panel2:#18201C;--ink:#E9EEEB;--mute:#98A49E;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
--brand:#3DDC97;--brand-ink:#04140C;--mint2:#A6F7CF;--acc:#3DDC97;--ok:#3DDC97;--bad:#ff6b6b;--glow:rgba(61,220,151,.10);
--r1:8px;--r2:12px;--r3:16px;--s1:8px;--s2:16px;--s3:24px;--s4:40px;--s5:64px;--s6:96px;--shadow:0 1px 0 rgba(255,255,255,.04) inset,0 24px 48px -28px rgba(0,0,0,.7)}
html.light{color-scheme:light;--bg:#F6F7F6;--panel:#FFFFFF;--panel2:#EEF1EF;--ink:#0D1411;--mute:#59665F;--line:rgba(13,20,17,.10);--line2:rgba(13,20,17,.18);--brand:#0E9F66;--brand-ink:#ffffff;--mint2:#0B7A4F;--acc:#0E9F66;--ok:#0E9F66;--glow:rgba(14,159,102,.10);--shadow:0 1px 2px rgba(13,20,17,.05),0 20px 40px -28px rgba(13,20,17,.25)}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;transition:background .4s,color .4s;overflow-x:clip}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
code,pre,.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
code{background:var(--panel2);padding:1px 6px;border-radius:6px;font-size:.9em;overflow-wrap:anywhere}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(4vw,16px)}
.band{padding:clamp(28px,4vw,56px) 0}
h1,h2,h3{line-height:1.04;text-wrap:balance;margin:0 0 .4em;font-family:Manrope,Inter,sans-serif;letter-spacing:-.025em}
h1 .dim,h2 .dim{color:var(--mute);opacity:.75}
.pill{display:inline-block;background:var(--brand);color:var(--brand-ink);border-radius:999px;padding:0 .32em .06em;line-height:1.1}
h1{font-size:clamp(34px,5vw,52px);font-weight:900;letter-spacing:-.02em}
h2{font-size:clamp(26px,3.4vw,36px);font-weight:800}
h3{font-size:19px;font-weight:700}
.muted{color:var(--mute)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:600;text-decoration:none}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:transparent;border-radius:999px}
.btn.ghost{border-radius:999px;background:transparent}
.btn.acc{background:var(--brand);color:var(--brand-ink);border-color:transparent;border-radius:999px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px}
.tag{display:inline-block;font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--panel2);color:var(--mute)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.hidden{display:none!important}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:68px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px;text-decoration:none;margin-right:auto}
.logo i{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--brand);color:var(--brand-ink);font-style:normal;font-family:"JetBrains Mono",monospace;font-size:15px}
nav.main{display:flex;gap:4px;flex-wrap:wrap}
nav.main a{padding:8px 12px;border-radius:10px;text-decoration:none;font-weight:600;color:var(--mute)}
nav.main a.on,nav.main a:hover{color:var(--brand)}
nav.main a.on{position:relative}nav.main a.on:after{content:"";position:absolute;left:50%;bottom:0;width:5px;height:5px;border-radius:50%;background:var(--brand);transform:translateX(-50%)}
.tools{display:flex;align-items:center;gap:12px}
select.lang{min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);padding:0 8px;font-weight:600}
.userchip{display:flex;align-items:center;gap:8px;font-weight:700;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:4px 12px 4px 4px;min-height:40px}
.userchip b{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--brand);color:var(--brand-ink)}
.plan-badge{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--brand);color:var(--brand-ink);font-weight:700}
@media(max-width:1120px){nav.main{order:3;width:100%;overflow-x:auto;flex-wrap:nowrap;padding-bottom:8px}nav.main a{flex:none}}
.demo-note{font-size:13px;text-align:center;padding:6px 12px;background:var(--panel2);color:var(--mute)}
.shot{border-radius:22px;overflow:hidden;border:1px solid var(--line);background:var(--panel);box-shadow:0 40px 80px -40px rgba(0,0,0,.7)}
.shot img{display:block;width:100%;height:auto}
.shots{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;align-items:start}
.shots .col{display:grid;gap:18px}
@media(max-width:800px){.shots{grid-template-columns:1fr}}
.ide{border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#06100c;box-shadow:0 30px 60px -30px rgba(0,0,0,.45)}
.ide .bar{display:flex;gap:6px;padding:12px 16px;background:#0c1914}
.ide .bar span{width:11px;height:11px;border-radius:50%;background:#ff5f57}.ide .bar span:nth-child(2){background:#febc2e}.ide .bar span:nth-child(3){background:#28c840}
.ide .split{display:grid;grid-template-columns:1fr 1fr;min-height:300px}
.ide pre{margin:0;padding:18px;color:#cfeee0;font-size:14px;white-space:pre-wrap;line-height:1.65}
.ide .caret{display:inline-block;width:8px;height:1.1em;background:var(--brand);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ide .live{background:#fff;color:#111;padding:14px;overflow:auto}
@media(max-width:600px){.ide .split{grid-template-columns:1fr}.ide .live{min-height:180px}#pPrev{min-height:200px!important}#pCode{min-height:220px!important}}

body.authmode header.top,body.authmode footer,body.authmode .demo-note{display:none}
body.authmode #view{max-width:none;padding:0}
.auth{display:grid;grid-template-columns:1fr 1fr;min-height:100vh;gap:24px;padding:16px}
@media(max-width:900px){.auth{grid-template-columns:1fr}.auth .art{display:none}}
.aside{position:relative;display:grid;place-items:center;padding:60px 10px 30px}
.aside .tl{position:absolute;top:10px;right:10px;display:flex;gap:10px;align-items:center}
.acard{width:min(470px,100%);background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:26px;box-shadow:0 40px 90px -50px rgba(0,0,0,.8)}
.acard h2{font:900 clamp(26px,3vw,34px)/1.1 sans-serif;margin:18px 0 18px}
.tabs2{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px;border-radius:18px;background:var(--bg);border:1px solid var(--line)}
.tabs2 button{min-height:48px;border:0;border-radius:13px;background:transparent;font-weight:800;color:var(--mute);cursor:pointer}
.tabs2 button.on{background:var(--panel2);color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.fld{display:grid;gap:8px;margin-bottom:16px}.fld>span{display:flex;justify-content:space-between;font-weight:800;font-size:14px}
.fld a{color:var(--brand);font-weight:700;text-decoration:none;cursor:pointer}
.inp{display:flex;align-items:center;gap:10px;min-height:56px;padding:0 16px;border-radius:16px;border:1px solid var(--line);background:var(--bg);transition:border-color .2s}
.inp:focus-within{border-color:var(--brand)}
.inp input{flex:1;border:0;background:transparent;outline:none;font-size:16px;min-height:50px}
.inp .pre{font-weight:800}.inp .ey{border:0;background:transparent;cursor:pointer;font-size:18px;color:var(--mute);min-width:32px;min-height:32px}
.strength{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:-6px 0 14px}.strength i{height:4px;border-radius:3px;background:var(--panel2)}
.strength i.on1{background:#ff6b6b}.strength i.on2{background:#f5b041}.strength i.on3{background:var(--brand)}
.chk{display:flex;gap:10px;align-items:center;font-size:14px;margin:4px 0 16px}.chk input{width:20px;height:20px;accent-color:var(--brand)}
.abtn{width:100%;min-height:58px;border:0;border-radius:16px;background:var(--brand);color:var(--brand-ink);font:800 17px Inter,sans-serif;cursor:pointer;box-shadow:0 14px 30px -12px rgba(56,242,161,.6);transition:transform .15s}
.abtn:active{transform:translateY(2px)}
.aerr{min-height:20px;color:var(--bad);font-weight:700;font-size:14px;margin:-6px 0 8px}
.alt{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;margin-top:12px;padding:0 14px;border-radius:16px;border:1px solid var(--line);background:transparent;font-weight:800;cursor:pointer;text-align:left;text-decoration:none}
.alt .dots{display:flex}.alt .dots span{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;margin-left:-6px;border:2px solid var(--panel);font-size:14px}
.alt .go2{margin-left:auto;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--brand);color:var(--brand-ink)}
.alt.green{background:color-mix(in srgb,var(--brand) 10%,transparent);border-color:color-mix(in srgb,var(--brand) 40%,transparent)}
.alt.green small{display:block;color:var(--mute);font-weight:600}.alt.green b{color:var(--brand)}
.sbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;border-radius:14px;font-weight:800;border:0;cursor:pointer;margin-bottom:10px;text-decoration:none}
.sbtn.tg{background:#2aa3e0;color:#fff}.sbtn.gg{background:#fff;color:#111;border:1px solid #ddd}
.or{display:flex;align-items:center;gap:12px;color:var(--mute);font-size:13px;margin:12px 0 16px}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.terms{font-size:12px;color:var(--mute);text-align:center;margin-top:16px}
.back3{display:inline-flex;gap:8px;align-items:center;min-height:42px;padding:0 16px;border-radius:99px;border:1px solid var(--line);font-weight:800;text-decoration:none}

/* lessons */
.tabs{display:flex;gap:8px;margin:14px 0 22px;flex-wrap:wrap}
.tabs button{min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-weight:700;cursor:pointer}
.tabs button.on{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.level{margin-bottom:22px}
.level h3{font-size:15px;color:var(--mute);font-weight:700}
.lrow{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
.lcard{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--panel);cursor:pointer;text-align:left;min-height:64px}
.lcard .num{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:800;background:var(--panel2)}
.lcard.done .num{background:var(--ok);color:#fff}
.lcard.locked{opacity:.55}
.lcard small{display:block;color:var(--mute);font-size:13px}
.progress{height:10px;border-radius:99px;background:var(--panel2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--brand);border-radius:99px}
/* lesson */
.lesson{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;align-items:start}
@media(max-width:900px){.lesson{grid-template-columns:1fr}}
.theory p{margin:.6em 0}
.example pre{background:#0f1515;color:#cfe3e1;padding:14px;border-radius:12px;margin:0;font-size:13.5px;white-space:pre-wrap}
.editor{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#0f1515}
.editor textarea{display:block;width:100%;min-height:230px;border:0;resize:vertical;background:#0f1515;color:#e3f0ee;padding:14px;font:14px/1.6 "JetBrains Mono",monospace;tab-size:2;outline:none}
.editor .hint{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;background:#172020;color:#8fb0ad;font-size:13px;flex-wrap:wrap}
.preview{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;height:220px}
.preview iframe{width:100%;height:100%;border:0}
.checks{list-style:none;padding:0;margin:12px 0}
.checks li{padding:8px 12px;border-radius:10px;margin-bottom:6px;background:var(--panel2)}
.checks li.ok{color:var(--ok)}.checks li.bad{color:var(--bad)}
.quiz .q{margin-bottom:18px}
.quiz label{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin:6px 0;cursor:pointer;min-height:44px}
.quiz label.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.quiz label.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.quiz .ex{font-size:14px;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.3)}
/* video */
.vcard{cursor:pointer;padding:0;overflow:hidden;text-align:left;border:1px solid var(--line)}
.vthumb{aspect-ratio:16/9;background:linear-gradient(135deg,#173131,#0f1515);display:grid;place-items:center;position:relative;color:#9fd1cf;font-family:"JetBrains Mono",monospace;font-size:13px;padding:14px}
.vthumb .play{position:absolute;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center}
.vthumb .play:after{content:"";border-left:18px solid #375758;border-top:11px solid transparent;border-bottom:11px solid transparent;margin-left:5px}
.vthumb .lock{position:absolute;top:10px;right:10px}
.vbody{padding:14px 16px}
.player{display:grid;grid-template-columns:1fr 1fr;border-radius:16px;overflow:hidden;border:1px solid var(--line);min-height:320px}
@media(max-width:700px){.player{grid-template-columns:1fr}}
.player pre{margin:0;background:#0f1515;color:#cfe3e1;padding:16px;font-size:14px;white-space:pre-wrap;min-height:220px}
.player iframe{width:100%;height:100%;min-height:220px;border:0;background:#fff}
.sub{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--panel2);min-height:52px}
/* AI */
.chat{display:flex;flex-direction:column;gap:10px;min-height:340px;max-height:60vh;overflow-y:auto;padding:4px}
.msg{max-width:85%;padding:12px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--brand);color:var(--brand-ink);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--panel2);border-bottom-left-radius:4px}
.chatform{display:flex;gap:10px;margin-top:12px}
.chatform textarea{flex:1;min-height:48px;max-height:160px;border-radius:12px;border:1px solid var(--line);background:var(--panel);padding:12px;font-size:16px;resize:vertical}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chips button{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:8px 14px;cursor:pointer;min-height:40px}
/* pricing */
.paylogos{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.paylogos span{font-weight:800;font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(5,10,10,.62);display:grid;place-items:center;padding:16px;overflow-y:auto}
.modal .box{position:relative;max-width:100%}
.modal .x{position:absolute;top:-6px;right:-6px;z-index:5;width:40px;height:40px;border-radius:50%;border:0;background:#fff;color:#111;font-size:22px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.profile-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.profile-grid .card b{display:block;font-size:30px;font-weight:900}
footer{border-top:1px solid var(--line);padding:26px 0;color:var(--mute);font-size:14px}


@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ===================== v4 design system ===================== */
h1,h2,h3{font-family:Manrope,Inter,sans-serif;letter-spacing:-.03em}
h1{font-weight:800}h2{font-weight:800}h3{font-weight:700;letter-spacing:-.015em}
.card,.fcard{border-radius:var(--r3)}
.btn{border-radius:var(--r1);font-weight:700;transition:background .15s,border-color .15s,transform .1s}
.btn:active{transform:translateY(1px)}
.btn.pri,.btn.acc,.btn.ghost{border-radius:var(--r1)}
.btn.pri:hover,.btn.acc:hover{background:color-mix(in srgb,var(--brand) 88%,var(--ink))}
.btn.ghost:hover,.btn:not(.pri):not(.acc):hover{border-color:var(--line2)}
.btn.lg{min-height:52px;padding:0 22px;font-size:16px}
.shot{border-radius:var(--r2);box-shadow:var(--shadow)}
.ide{border-radius:var(--r2);box-shadow:var(--shadow)}
.logo i{border-radius:8px}
.lbl{display:flex;align-items:center;gap:10px;font:600 12px/1 "JetBrains Mono",monospace;letter-spacing:.04em;color:var(--mute);text-transform:uppercase;margin-bottom:18px}
.lbl b{color:var(--brand);font-weight:600}
.lbl:after{content:"";flex:0 0 40px;height:1px;background:var(--line2)}
.sec{padding:var(--s5) 0;border-top:1px solid var(--line)}
.sec-t{font-size:clamp(28px,3.6vw,44px);line-height:1.06;margin:0 0 14px;max-width:18ch}
.sec-p{color:var(--mute);font-size:17px;max-width:58ch;margin:0}
.sec-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.8fr);gap:var(--s3);align-items:end;margin-bottom:var(--s4)}
@media(max-width:860px){.sec-head{grid-template-columns:1fr}}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts div{padding:22px 20px 22px 0}.facts div+div{padding-left:20px;border-left:1px solid var(--line)}
.facts b{display:block;font:800 26px/1.1 Manrope,sans-serif;letter-spacing:-.02em}.facts span{font-size:14px;color:var(--mute)}
@media(max-width:700px){.facts{grid-template-columns:1fr 1fr}.facts div:nth-child(3){padding-left:0;border-left:0}.facts div:nth-child(n+3){border-top:1px solid var(--line)}}
/* how it works */
.how{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:var(--s4);align-items:start}
.how ol{list-style:none;margin:0;padding:0;counter-reset:st}
.how li button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:44px 1fr;gap:4px 14px;width:100%;padding:20px 0;border-top:1px solid var(--line)}
.how li:last-child button{border-bottom:1px solid var(--line)}
.how li button:before{counter-increment:st;content:"0" counter(st);grid-row:span 2;font:600 13px/1.9 "JetBrains Mono",monospace;color:var(--mute)}
.how li b{font:700 19px/1.3 Manrope,sans-serif;letter-spacing:-.01em}
.how li span{color:var(--mute);font-size:15px;max-height:0;overflow:hidden;opacity:0;transition:max-height .3s,opacity .3s}
.how li.on button:before{color:var(--brand)}
.how li.on span{max-height:120px;opacity:1}
.how li button:focus-visible{outline:2px solid var(--brand);outline-offset:4px;border-radius:4px}
.how .view{position:sticky;top:96px;border-radius:var(--r2);overflow:hidden;border:1px solid var(--line2);background:var(--panel);box-shadow:var(--shadow);aspect-ratio:4/3;display:grid;place-items:center}
.how .view img{width:100%;height:100%;object-fit:contain;background:var(--bg);display:block}
@media(max-width:860px){.how{grid-template-columns:1fr}.how .view{position:static;order:-1}}
/* courses */
.courses{border-top:1px solid var(--line2)}
.course{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr) auto;gap:var(--s3);padding:28px 0;border-bottom:1px solid var(--line);align-items:start}
.course h3{font-size:28px;margin:0 0 6px;display:flex;align-items:center;gap:12px}
.course .st{font:600 12px/1 Inter,sans-serif;padding:6px 10px;border-radius:99px;border:1px solid var(--line2);color:var(--mute)}
.course .st.on{color:var(--brand);border-color:color-mix(in srgb,var(--brand) 45%,transparent)}
.course .meta{color:var(--mute);font-size:15px}
.course ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.course li{font:500 13px/1 "JetBrains Mono",monospace;padding:8px 10px;border-radius:6px;background:var(--panel2);color:var(--ink)}
.course.soon{opacity:.62}
@media(max-width:860px){.course{grid-template-columns:1fr;gap:14px}}
/* practice */
.practice{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:var(--s3);align-items:stretch}
.practice .side{display:flex;flex-direction:column;justify-content:space-between;gap:18px}
.practice .side p{margin:0;color:var(--mute)}
.chk-list{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.chk-list li{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:15px}
.chk-list li:before{content:"✓";color:var(--brand);font-weight:800}
@media(max-width:860px){.practice{grid-template-columns:1fr}}
.projects{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3);margin-top:var(--s4)}
.projects figure{margin:0}
.projects .pic{border-radius:var(--r2);overflow:hidden;border:1px solid var(--line);background:#fff;aspect-ratio:16/10}
.projects img{display:block;width:100%;height:100%;object-fit:cover;object-position:top left;transition:transform .4s}
.projects figure:hover img{transform:scale(1.03)}
.projects figcaption{display:flex;justify-content:space-between;gap:10px;margin-top:10px;font-size:14px}
.projects figcaption small{color:var(--mute);font-family:"JetBrains Mono",monospace;font-size:12px;white-space:nowrap}
.projects a{text-decoration:none}
@media(max-width:860px){.projects{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.projects{grid-template-columns:1fr}}
/* progress */
.prog4{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:var(--s4);align-items:center}
.meters{display:grid;gap:0;border-top:1px solid var(--line)}
.meter{display:grid;grid-template-columns:1fr auto;gap:6px 16px;padding:18px 0;border-bottom:1px solid var(--line)}
.meter b{font:800 28px/1 Manrope,sans-serif;letter-spacing:-.02em}
.meter span{color:var(--mute);font-size:15px}
.meter p{grid-column:1/-1;margin:0;font-size:14px;color:var(--mute)}
.meter .bar{grid-column:1/-1;height:6px;border-radius:9px;background:var(--panel2);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--brand)}
.note{font-size:14px;color:var(--mute);margin-top:16px}
.note a{color:var(--brand)}
@media(max-width:860px){.prog4{grid-template-columns:1fr}}
/* pricing */
.plans2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--line2);border-radius:var(--r3);overflow:hidden;background:var(--panel)}
.plan2{display:flex;flex-direction:column;padding:28px;position:relative}
.plan2+.plan2{border-left:1px solid var(--line)}
.plan2.pop{background:color-mix(in srgb,var(--brand) 6%,var(--panel))}
.plan2 h3{font-size:20px;margin:0 0 4px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.plan2 .ribbon2{font:600 12px/1 Inter,sans-serif;padding:6px 10px;border-radius:99px;background:var(--brand);color:var(--brand-ink);letter-spacing:0}
.plan2 .who{color:var(--mute);font-size:14px;margin:0 0 18px;min-height:2.6em}
.plan2 .pr{font:800 36px/1 Manrope,sans-serif;letter-spacing:-.03em}
.plan2 .pr small{font:500 15px Inter,sans-serif;color:var(--mute);letter-spacing:0}
.plan2 .alt2{font-size:13px;color:var(--mute);margin-top:6px;min-height:1.2em}
.plan2 dl{margin:22px 0;display:grid;gap:0}
.plan2 dl div{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.plan2 dt{color:var(--mute)}.plan2 dd{margin:0;font-weight:700;text-align:right}
.plan2 dd.no{color:var(--mute);font-weight:500}
.plan2 .btn{margin-top:auto;width:100%}
@media(max-width:900px){.plans2{grid-template-columns:1fr}.plan2+.plan2{border-left:0;border-top:1px solid var(--line)}}
/* faq */
.faq4{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:var(--s4)}
.faq4 details{border-bottom:1px solid var(--line)}
.faq4 details:first-child{border-top:1px solid var(--line)}
.faq4 summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:16px;padding:20px 0;font:700 17px/1.35 Manrope,sans-serif}
.faq4 summary::-webkit-details-marker{display:none}
.faq4 summary:after{content:"+";font:400 22px/1 Inter;color:var(--mute);transition:transform .2s}
.faq4 details[open] summary:after{transform:rotate(45deg)}
.faq4 details p{margin:0 0 20px;color:var(--mute);max-width:62ch}
@media(max-width:860px){.faq4{grid-template-columns:1fr}}
.endcta{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);flex-wrap:wrap;padding:var(--s4);border-radius:var(--r3);background:var(--panel);border:1px solid var(--line2)}
.endcta h2{margin:0;font-size:clamp(24px,3vw,34px)}
/* footer */
footer{padding:var(--s5) 0 var(--s3)}
.foot{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(2,minmax(0,1fr));gap:var(--s3)}
.foot h4{margin:0 0 12px;font:600 12px/1 "JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.foot p{margin:12px 0 0;max-width:38ch}
.foot ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.foot a{text-decoration:none;color:var(--ink)}.foot a:hover{color:var(--brand)}
.foot .copy{grid-column:1/-1;border-top:1px solid var(--line);padding-top:18px;margin-top:var(--s2);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px}
@media(max-width:760px){.foot{grid-template-columns:1fr}.foot>div:first-child{grid-column:1/-1}}
/* auth side visual */
.art{position:relative;border-radius:var(--r3);overflow:hidden;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;padding:clamp(24px,4vw,48px);gap:28px;min-height:100%}
.art .device{margin:0 auto;max-width:300px;width:70%}
.art blockquote{margin:0;font:700 clamp(20px,2.2vw,28px)/1.25 Manrope,sans-serif;letter-spacing:-.02em;max-width:22ch}
.art blockquote small{display:block;margin-top:10px;font:500 14px Inter,sans-serif;color:var(--mute);letter-spacing:0}
/* reveal */
.rv{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}}
@keyframes ua-bootHide{to{opacity:0;visibility:hidden;pointer-events:none}}
.device{border-radius:22px;padding:6px;background:#05080a;border:1px solid var(--line2);box-shadow:var(--shadow)}.device img{display:block;width:100%;height:auto;border-radius:17px}.art .device{position:relative}
/* ===================== Forge layer (adapted from forge-hardware-hero) ===================== */
:root{--fg-ease:cubic-bezier(.22,1,.36,1);--nav-h:76px}
:root{color-scheme:dark;--bg:#141414;--panel:#1D1C1B;--panel2:#262523;--ink:#F5F3EF;--mute:#AAA7A3;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.18);--brand:#3DDC97;--brand-deep:#2AC584;--brand-ink:#0F1512;--shadow:0 40px 80px -40px rgba(0,0,0,.9)}
html.light{color-scheme:light;--bg:#F5F3EF;--panel:#FFFFFF;--panel2:#ECE9E3;--ink:#141414;--mute:#5F5C58;--line:rgba(20,20,20,.09);--line2:rgba(20,20,20,.2);--brand:#0E9F66;--brand-deep:#0B8455;--brand-ink:#fff;--shadow:0 30px 60px -36px rgba(20,20,20,.35)}
body{font-family:Archivo,Inter,system-ui,sans-serif;font-stretch:102%;-webkit-font-smoothing:antialiased}
h1,h2,h3,.sec-t{font-family:Archivo,Manrope,Inter,sans-serif;font-stretch:104%;letter-spacing:-.04em;font-weight:720}
h3{letter-spacing:-.02em;font-weight:650}
::selection{background:var(--brand);color:var(--brand-ink)}
.fmono,.lbl,.foot h4{font-family:"Geist Mono","JetBrains Mono",ui-monospace,monospace}
/* buttons */
.btn{border-radius:14px;font-weight:600;min-height:46px;transition:background-color .3s var(--fg-ease),color .3s,border-color .3s,translate .3s var(--fg-ease),box-shadow .3s}
.btn.pri,.btn.acc{border-radius:14px;position:relative;overflow:hidden}
.btn.pri:hover,.btn.acc:hover{background:var(--brand-deep);translate:0 -2px;box-shadow:0 14px 30px -14px color-mix(in srgb,var(--brand) 70%,transparent)}
.btn.pri:after,.btn.acc:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.38) 50%,transparent 70%);transform:translateX(-120%);pointer-events:none}
.btn.pri:hover:after,.btn.acc:hover:after{transform:translateX(120%);transition:transform .7s var(--fg-ease)}
.btn.ghost{border-radius:14px;border-color:color-mix(in srgb,var(--ink) 45%,transparent)}
.btn.ghost:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.lg{min-height:52px;border-radius:16px;padding:0 22px;font-size:15px}
.btn .ar{transition:transform .3s var(--fg-ease)}.btn:hover .ar{transform:translateX(5px)}
.card{border-radius:20px}
.lbl{gap:12px;font-size:11.5px;letter-spacing:.22em;font-weight:500}
.lbl:before{content:"";width:28px;height:1px;background:var(--brand);order:-1}.lbl:after{display:none}
.lbl b{color:var(--mute);font-weight:500}
/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:40;background:transparent;backdrop-filter:none;border-bottom:1px solid transparent;transition:background-color .35s var(--fg-ease),border-color .35s var(--fg-ease)}
.top[data-scrolled="true"]{background:color-mix(in srgb,var(--bg) 74%,transparent);border-color:var(--line);-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%)}
.top .wrap.navw{position:relative;display:flex;align-items:center;gap:20px;height:var(--nav-h);min-height:0;flex-wrap:nowrap;max-width:1600px;padding-inline:clamp(20px,3.9vw,56px)}
.fg-logo{font-family:Archivo,Manrope,sans-serif;font-weight:800;font-stretch:118%;letter-spacing:-.045em;font-size:24px;line-height:1;color:var(--ink);text-decoration:none;white-space:nowrap;position:relative}
.fg-logo:after{content:"";position:absolute;inset:-10px -4px}
.ember{color:var(--brand);display:inline-block;text-shadow:0 0 10px color-mix(in srgb,var(--brand) 45%,transparent)}
.fg-logo:hover .ember{animation:fgEmber .9s var(--fg-ease)}
@keyframes fgEmber{30%{text-shadow:0 0 14px #fff,0 0 30px var(--brand)}}
nav.main{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:30px;flex-wrap:nowrap}
nav.main>a,.dd>button{position:relative;padding:8px 0;border-radius:6px;background:none;border:0;cursor:pointer;font:500 14.5px Archivo,Inter,sans-serif;color:color-mix(in srgb,var(--ink) 75%,transparent);text-decoration:none;display:flex;align-items:center;gap:4px;white-space:nowrap}
nav.main>a:hover,nav.main>a.on,.dd>button:hover,.dd>button[aria-expanded="true"]{color:var(--ink)}
nav.main>a:after,.dd>button:after{content:"";position:absolute;left:0;right:0;bottom:2px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform .35s var(--fg-ease)}
nav.main>a:hover:after,nav.main>a.on:after,.dd>button:hover:after,.dd>button[aria-expanded="true"]:after{transform:scaleX(1);transform-origin:left}
nav.main a.on:before{display:none}
.dd{position:relative}.dd svg{width:14px;height:14px;transition:transform .3s}.dd>button[aria-expanded="true"] svg{transform:rotate(180deg)}
.fg-panel{position:absolute;top:100%;left:50%;margin-top:12px;width:340px;padding:8px;border-radius:18px;background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line2);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 18px 40px -18px rgba(0,0,0,.7);transform:translate(-50%,-6px) scale(.98);opacity:0;visibility:hidden;transition:opacity .22s var(--fg-ease),transform .22s var(--fg-ease),visibility .22s;transform-origin:top;z-index:50}
.dd.open .fg-panel{opacity:1;visibility:visible;transform:translate(-50%,0) scale(1)}
.clist{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.clist a{display:flex;align-items:center;gap:12px;padding:8px;border-radius:12px;text-decoration:none;color:var(--ink);transition:background .2s}
.clist a:hover,.clist a:focus-visible{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.clist .ic{display:grid;place-items:center;width:36px;height:36px;flex:none;border-radius:10px;background:color-mix(in srgb,var(--ink) 6%,transparent);transition:background .3s,color .3s}
.clist a:hover .ic{background:var(--brand);color:var(--brand-ink)}
.clist .ic svg{width:17px;height:17px}
.clist b{display:block;font-size:14px;font-weight:500}.clist small{display:block;font-size:12.5px;color:var(--mute)}
.clist .go{margin-left:auto;color:var(--mute);transition:transform .3s var(--fg-ease)}.clist a:hover .go{transform:translateX(4px)}
.fg-panel .all{display:flex;justify-content:space-between;align-items:center;margin-top:4px;padding:12px 8px 6px;border-top:1px solid var(--line2);color:var(--brand);font-weight:600;font-size:13px;text-decoration:none}
.tools{margin-left:auto;display:flex;align-items:center;gap:4px}
.ibtn{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;border:0;background:none;color:color-mix(in srgb,var(--ink) 80%,transparent);cursor:pointer;transition:color .2s,background .2s;text-decoration:none}
.ibtn:hover{color:var(--ink)}.ibtn svg{width:19px;height:19px}
.srch{position:relative;display:flex;align-items:center;height:44px;border-radius:12px;border:1px solid transparent;transition:border-color .3s}
.srch.open{border-color:var(--line2);background:color-mix(in srgb,var(--panel) 60%,transparent)}
.srch.open:focus-within{border-color:var(--brand)}
.srch input{width:0;padding:0;border:0;background:transparent;color:var(--ink);font:14px Archivo,Inter,sans-serif;outline:none;transition:width .35s var(--fg-ease)}
.srch.open input{width:clamp(110px,16vw,220px);padding-right:10px}
.srch input::-webkit-search-cancel-button{-webkit-appearance:none}
.sres{position:absolute;top:calc(100% + 8px);right:0;width:min(320px,86vw);padding:6px;border-radius:14px;background:var(--panel);border:1px solid var(--line2);box-shadow:0 18px 40px -18px rgba(0,0,0,.7);list-style:none;margin:0;z-index:60}
.sres a{display:flex;justify-content:space-between;gap:10px;padding:9px 10px;border-radius:10px;text-decoration:none;color:var(--ink);font-size:14px}
.sres a:hover,.sres a.hl{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.sres small{color:var(--mute);font-family:"Geist Mono",monospace;font-size:11px;white-space:nowrap}
select.lang{height:44px;min-height:0;border:0;background:transparent;color:color-mix(in srgb,var(--ink) 80%,transparent);font:500 12px "Geist Mono",monospace;letter-spacing:.12em;padding:0 6px;cursor:pointer}
select.lang option{background:var(--panel);color:var(--ink)}
#themeBtn .sun{display:none}html.light #themeBtn .sun{display:block}html.light #themeBtn .moon{display:none}
.userchip{min-height:40px;border-radius:12px;background:transparent}
.mbtn{display:none;border:1px solid var(--line2)}
.mmenu{border-top:1px solid var(--line2);padding:12px clamp(20px,3.9vw,56px) 24px;background:color-mix(in srgb,var(--bg) 96%,transparent);max-height:calc(100svh - var(--nav-h));overflow:auto}
.mmenu>a{display:flex;align-items:center;min-height:48px;font-size:17px;font-weight:500;color:var(--ink);text-decoration:none}
.mmenu p{font:500 10.5px "Geist Mono",monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin:16px 0 8px}
@media(max-width:1100px){nav.main{display:none}.mbtn{display:grid}}
@media(max-width:560px){.top .wrap.navw{gap:8px}.fg-logo{font-size:20px}.srch.open~*{display:none}#signinBtn,.userchip span{display:none}.tools .lang{padding:0 2px}}
.mrow{display:none;gap:8px;align-items:center;margin-top:8px}.mrow .lang{border:1px solid var(--line2);border-radius:12px;padding:0 12px}#themeBtn2{border:1px solid var(--line2)}
@media(max-width:420px){.mrow{display:flex}.tools>#lang,.tools>#themeBtn{display:none}.fg-logo{font-size:18px}}
.demo-note{position:relative;z-index:41;font:500 11px "Geist Mono",monospace;letter-spacing:.08em;background:var(--bg);border-bottom:1px solid var(--line)}
/* ---------- splash ---------- */
#boot{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:transparent;cursor:pointer;animation:ua-bootHide .4s 4.2s forwards;transition:none}
#boot .veil{position:absolute;inset:0;background:var(--bg);transition:opacity .6s ease}
#boot .heat{position:absolute;width:70vmin;height:70vmin;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--brand) 16%,transparent) 0%,color-mix(in srgb,var(--brand) 5%,transparent) 38%,transparent 68%);opacity:0;transform:scale(.8);transition:opacity 1.8s ease-out,transform 1.8s ease-out}
#boot.forge .heat{opacity:1;transform:scale(1)}
#boot .stage{position:relative;display:flex;flex-direction:column;align-items:center}
#boot .word{position:relative;display:flex;font-size:clamp(34px,8.6vw,128px);transform-origin:top left;white-space:pre}
#boot .word .ch{position:relative;display:inline-block}
#boot .word .ch>i{font-style:normal;display:inline-block;opacity:0;transform-origin:50% 100%}
#boot.forge .word .ch>i{animation:fgStrike .42s ease-out both,fgCool 1.3s .1s both;animation-delay:var(--d),calc(var(--d) + .1s)}
@keyframes fgStrike{0%{opacity:1;transform:translateY(-.32em) scale(.94,1.1)}35%{transform:translateY(0) scale(1.14,.82)}100%{opacity:1;transform:none}}
@keyframes fgCool{0%{color:#FFF6DD;text-shadow:0 0 34px rgba(255,236,190,.95)}20%{color:#DDFFE9;text-shadow:0 0 22px color-mix(in srgb,var(--brand) 60%,transparent)}55%{color:var(--brand);text-shadow:0 0 8px color-mix(in srgb,var(--brand) 20%,transparent)}100%{color:var(--ink);text-shadow:none}}
#boot .word .flash{position:absolute;left:-25%;right:-25%;bottom:-.08em;height:.16em;opacity:0;background:radial-gradient(ellipse at center,rgba(220,255,235,.95) 0%,color-mix(in srgb,var(--brand) 55%,transparent) 35%,transparent 70%);filter:blur(2px)}
#boot.forge .word .flash{animation:fgFlash .5s both;animation-delay:var(--i)}
@keyframes fgFlash{15%{opacity:1}100%{opacity:0}}
#boot .word .dot{color:var(--brand);opacity:0;display:inline-block}
#boot.forge .word .dot{animation:fgDrop .62s ease-in both;animation-delay:var(--d)}
@keyframes fgDrop{0%{opacity:1;transform:translateY(-1.6em)}70%{transform:translateY(0)}85%{transform:translateY(-.06em)}100%{opacity:1;transform:none}}
#boot .anvil{position:absolute;left:-6%;right:-6%;bottom:.02em;height:1px;background:rgba(255,255,255,.15);opacity:0;transform:scaleX(.4);transition:opacity .6s,transform .6s}
#boot.forge .anvil{opacity:1;transform:none}
#boot .spark{position:absolute;left:50%;bottom:.1em;border-radius:50%;background:#e0ffe9;box-shadow:0 0 6px 1px color-mix(in srgb,var(--brand) 90%,transparent),0 0 14px 2px color-mix(in srgb,var(--brand) 45%,transparent);opacity:0;pointer-events:none}
#boot .eyebrow{position:absolute;top:calc(100% + 28px);font:500 11px "Geist Mono",monospace;text-transform:uppercase;letter-spacing:.5em;color:var(--mute);white-space:nowrap;opacity:0;transition:opacity .9s,letter-spacing .9s}
#boot.forge .eyebrow{opacity:1;letter-spacing:.32em;transition-delay:1.6s}
#boot.handoff .veil,#boot.skip .veil{opacity:0}#boot.handoff .heat,#boot.handoff .eyebrow,#boot.handoff .anvil{opacity:0;transition-delay:0s;transition-duration:.3s}
#boot.skip .stage{opacity:0;transition:opacity .2s}
html.splash-on .top .fg-logo{opacity:0}
/* ---------- hero ---------- */
.fhero{position:relative;isolation:isolate;width:100vw;margin-left:calc(50% - 50vw);margin-top:calc(-1 * var(--nav-h));overflow:hidden}
.fhero .bg{position:absolute;inset:0;z-index:-1;pointer-events:none}
.fhero .bg .fb{position:absolute;inset:0;background:linear-gradient(148deg,transparent 8%,rgba(255,189,133,.07) 22%,rgba(255,189,133,.035) 40%,transparent 58%)}
.fhero canvas{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity 1.2s var(--fg-ease)}
.fhero canvas[data-ready]{opacity:1}

/* ---------- code checker (port of the bot's server checker) ---------- */
const BOOL=new Set(["required","controls","checked","disabled","multiple","autoplay","loop","muted","open","selected"]);
const decls=b=>{const o={};b.split(";").forEach(d=>{const i=d.indexOf(":");if(i>0)o[d.slice(0,i).trim().toLowerCase()]=d.slice(i+1).replace("!important","").trim().toLowerCase()});return o};
function parseCss(css){const r=[];css=css.replace(/\/\*[\s\S]*?\*\//g,"");for(const m of css.matchAll(/([^{}]+)\{([^{}]*)\}/g)){const d=decls(m[2]);m[1].split(",").forEach(s=>{if(s.trim())r.push([s.trim().toLowerCase(),d])})}return r}
function selHits(sel,target){const last=sel.trim().split(/\s*[>+~]\s*|\s+/).pop();const e=target.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");return new RegExp((/^[.#]/.test(target)?"":"(?<![\\w.#-])")+e+"(?![\\w-])").test(last)}
function propOk(d,p,v){for(const k in d){if(p==="border"&&k==="border-radius")continue;if((k===p||k.startsWith(p+"-"))&&d[k]&&(v==null||d[k].includes(v)))return true}return false}
function runChecks(code,rules){
 const doc=new DOMParser().parseFromString(code,"text/html");const css=parseCss([...doc.querySelectorAll("style")].map(s=>s.textContent).join("\n"));
 const sq=s=>s.replace(/\s+/g,"").toLowerCase();
 return rules.map(r=>{let ok=false;try{const q=r.q;
  if(r.t==="text")ok=[...doc.querySelectorAll(q)].some(e=>e.textContent.trim());
  else if(r.t==="el")ok=!!doc.querySelector(q);
  else if(r.t==="count")ok=doc.querySelectorAll(q).length>=r.n;
  else if(r.t==="attr")ok=[...doc.querySelectorAll(q)].some(e=>{const v=(e.getAttribute(r.a)||"").trim();return"v"in r?v.toLowerCase()===r.v:e.hasAttribute(r.a)&&(v||BOOL.has(r.a))});
  else if(r.t==="css")ok=css.some(([s,d])=>selHits(s,q)&&propOk(d,r.p,r.v))||[...doc.querySelectorAll(q)].some(e=>propOk(decls(e.getAttribute("style")||""),r.p,r.v));
  else if(r.t==="src")ok=sq(code).includes(sq(r.s));
 }catch(e){ok=false}return{ok,msg:tr(r.m)}})}

function setupEditor(ta,onChange){
 ta.addEventListener("keydown",e=>{
  if(e.key==="Tab"){e.preventDefault();const p=ta.selectionStart,v=ta.value,before=v.slice(0,p),m=before.match(/(^|[\s>])([a-z][a-z0-9]*)$/i);
   let ins="  ",caret=2,cut=0;
   if(before.endsWith("!")){cut=1;ins='<!DOCTYPE html>\n<html>\n<head>\n  <title>Sahifa</title>\n</head>\n<body>\n  \n</body>\n</html>';caret=ins.indexOf("  \n</body>")+2}
   else if(m){const tag=m[2].toLowerCase();cut=tag.length;ins=VOID.has(tag)?"<"+tag+">":"<"+tag+"></"+tag+">";caret=VOID.has(tag)?ins.length:tag.length+2}
   ta.value=v.slice(0,p-cut)+ins+v.slice(ta.selectionEnd);ta.selectionStart=ta.selectionEnd=p-cut+caret;onChange()}
  else if(e.key===">"){const p=ta.selectionStart,before=ta.value.slice(0,p),m=before.match(/<([a-z][a-z0-9]*)(\s[^<>]*)?$/i);
   if(m&&!VOID.has(m[1].toLowerCase())){e.preventDefault();const c="></"+m[1]+">";ta.value=before+c+ta.value.slice(ta.selectionEnd);ta.selectionStart=ta.selectionEnd=p+1;onChange()}}});
 ta.addEventListener("input",onChange)}

   ctx.drawImage(bm,x,y,h.w*s,h.h*s);
   if(W/H>0.9){const dw=h.w*s,g=ctx.createLinearGradient(x,0,x+dw,0);g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(.24,"#000");g.addColorStop(.76,"#000");g.addColorStop(1,"rgba(0,0,0,0)");
    ctx.globalCompositeOperation="destination-in";ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation="source-over"}};
  const run=async()=>{if(busy)return;busy=true;try{while(shown!==want){const i=want,bm=await get(i);paint(bm);shown=i}}finally{busy=false}
   for(const k of [want+1,want+2,want-1])if(k>=0&&k<h.n&&!h.cache.has(k))get(k).catch(()=>{})};
  const size=()=>{const r=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);shown=-1;run()};
  const on=()=>{if(!document.contains(sec)){removeEventListener("scroll",tick);removeEventListener("resize",size);return}
   const p=prog();text(p);want=Math.round(p*(h.n-1));run()};
  const tick=()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;on()})};
  addEventListener("scroll",tick,{passive:true});addEventListener("resize",size);size();on()}).catch(()=>{sec.remove()})}

  try{if(sample){const r=await sample(hist,{cache:false,modelTier:"quick",onText:({text})=>{ans.content=text;drawChat()}});ans.content=r.text}
   else{const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),55000);
    const r=await fetch("/api/ai",{method:"POST",signal:ctl.signal,headers:{"Content-Type":"application/json"},body:JSON.stringify({lang:S.lang,token:S.tok,messages:S.aiMsgs.slice(1,-1).filter(m=>!m.err&&m.content!=="…").slice(-10)})}).finally(()=>clearTimeout(tm));
    const j=await r.json().catch(()=>({}));if(r.ok&&j.text)ans.content=j.text;else{ans.err=true;ans.content=r.status===404?t("aiOff"):j.error==="daily limit"?t("aiLimit",{n:j.limit}):t("aiErr")}}}
  catch(err){ans.err=true;ans.content=err&&err.code==="not_granted"?t("aiOff"):t("aiErr")}
  drawChat();const l=$("#aiLeft");if(l&&lim<1e6)l.textContent=t("left",{n:Math.max(0,lim-dayCount("ai"))})})}

/* ---------- pricing ---------- */
function vPricing(){return `<section class="band">${lbl(5,"s5")}<div class="sec-head"><h1 class="sec-t">${t("plA")} <span style="color:var(--mute)">${t("plB")}</span></h1><p class="sec-p">${t("tgNote")}</p></div>${plansHTML()}
 ${redeemBox()}<h3 style="margin-top:32px">${t("payMethods")}</h3><div class="paylogos"><span>VISA</span><span>Mastercard</span><span>Uzcard</span><span>HUMO</span></div></section>`}
function vProfile(){if(!S.user){setTimeout(signin);return vHome()}const doneN=LESSONS.filter(l=>S.prog[l.id]?.done).length;
 return `<section class="band"><h1>${t("profile")}</h1><p class="muted">${esc(S.user.name)} · ${esc(S.user.email)}</p>
 <div class="profile-grid"><div class="card"><span class="muted">${t("plan")}</span><b>${PLANS[S.user.plan].name}</b></div><div class="card"><span class="muted">${t("xp")}</span><b>${S.xp}</b></div><div class="card"><span class="muted">${t("streak")}</span><b>🔥 ${S.streak}</b></div><div class="card"><span class="muted">${t("completed")}</span><b>${doneN}/60</b></div></div>
 <div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap">${S.user.plan!=="alpha"?`<a class="btn pri" href="#pricing">${t("upgrade")}</a>`:""}<button class="btn" id="doLogout">${t("logout")}</button></div>${S.exp?`<p class="muted" style="margin-top:12px">${rd("until")}: ${new Date(S.exp).toLocaleDateString()}</p>`:""}${redeemBox()}</section>`}

/* ---------- router ---------- */
function route(){if(!$("#modal").classList.contains("hidden"))closeModal();document.body.classList.remove("authmode");const h=location.hash.slice(1)||"home";const v=$("#view");let html,after;
 const m=h.match(/^lesson-(\d+)$/);
 if(m){html=vLesson(+m[1]);after=()=>{bindLesson(+m[1]);gate(+m[1])}}
 else if(h==="lessons")html=vLessons();else if(h==="videos")html=vVideos();
 else if(h==="ai"){html=vAi();after=bindAi}else if(h==="pricing")html=vPricing();
 else if(h==="profile"){html=vProfile();after=()=>{const b=$("#doLogout");if(b)b.onclick=()=>{S.user=null;store.set("user",null);S.tok=null;store.set("tok",null);paintStatic();location.hash="home"}}}
 else if(h==="login"||h==="signup"||h==="try"){html=vAuth(h);after=()=>bindAuth(h)}
 else{html=vHome();after=bindHome}
 if(html==="")return;v.innerHTML=html;after&&after();
 document.querySelectorAll("nav.main>a,#mMenu>a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+(m?"lessons":h)));scrollTo(0,0)}
addEventListener("hashchange",route);
$("#view").addEventListener("click",e=>{const b=e.target.closest("[data-course],[data-lesson],[data-video]");if(!b)return;
 if(b.dataset.course){S.course=b.dataset.course;route()}
 else if(b.dataset.lesson){const L=LESSONS.find(l=>l.id===+b.dataset.lesson),a=access(L);if(!a.ok&&!S.prog[L.id]?.done){toast(a.msg);if(!inPlan(L))setTimeout(()=>location.hash="pricing",900)}else location.hash="lesson-"+L.id}
 else if(b.dataset.video)playVideo(+b.dataset.video);
});

applyTheme();syncPlan();paintStatic();bindHeader();splash();
fetch("lessons.json").then(r=>r.json()).then(d=>{LESSONS=d;route()}).catch(()=>{$("#view").innerHTML='<section class="band"><h2>Error loading lessons</h2></section>'})
 ;
}
</script>
