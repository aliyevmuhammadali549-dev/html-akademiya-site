<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Admin</title>
<style>
body{margin:0;background:#0A0E0C;color:#E9EEEB;font:15px/1.5 system-ui,sans-serif;padding:24px;max-width:760px;margin:auto}
h1{font-size:22px}h2{font-size:17px;margin-top:28px}.card{background:#111714;border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:16px;margin:12px 0}
input,select,button{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.15);background:#18201C;color:inherit}
button{background:#3DDC97;color:#04140C;border:0;font-weight:600;cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
code{background:#18201C;padding:4px 8px;border-radius:6px;font-size:15px}.muted{color:#98A49E}.err{color:#ff6b6b}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.06)}
.x{background:none;color:#ff6b6b;padding:2px 6px}
</style></head><body>
<h1>HTML Akademiya — admin</h1>
<form class="card" id="lf" style="display:grid;gap:8px;max-width:360px">
 <input id="user" placeholder="Login" autocomplete="username" required>
 <input id="mail" type="email" placeholder="Email" autocomplete="email" required>
 <input id="key" type="password" placeholder="Parol" autocomplete="current-password" required>
 <button>Kirish</button></form>
<p id="msg" class="err"></p>
<div id="app" hidden>
 <div class="card"><h2 style="margin-top:0">Yangi kod</h2>
  <div class="row">
   <select id="plan"><option value="premium">Premium</option><option value="alpha">Alpha</option></select>
   <select id="days"><option value="30">30 kun</option><option value="90">90 kun</option><option value="365">1 yil</option><option value="0">Umrbod</option></select>
   <input id="n" type="number" min="1" max="50" value="1" style="width:80px" title="Nechta">
   <button id="make">Kod yaratish</button>
  </div>
  <div id="out" style="margin-top:12px"></div>
 </div>
 <h2>Ishlatilmagan kodlar</h2><div class="card"><table id="unused"></table></div>
 <h2>Faollashtirilganlar</h2><div class="card"><table id="log"></table></div>
 <h2>Tarifni bekor qilish</h2><div class="card row"><input id="rev" placeholder="o'quvchi emaili" style="flex:1"><button id="revBtn">Bekor qilish</button></div>
 <p><button id="out2" style="background:#18201C;color:#E9EEEB">Chiqish</button></p>
</div>
<script>
const $=s=>document.querySelector(s);let A=JSON.parse(sessionStorage.getItem("hak")||"null");
const api=async b=>{const r=await fetch("/api/admin",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({...b,...A})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.status);return j};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dt=t=>new Date(t).toLocaleString("uz-UZ",{dateStyle:"short",timeStyle:"short"});
const dl=d=>d?d+" kun":"umrbod";
const ERR={"wrong key":"Login, email yoki parol noto'g'ri","locked":"Ko'p xato urinish — 15 daqiqadan keyin qayta urining","not configured":"Vercel'da ADMIN_KEY va ADMIN_EMAIL qo'shilmagan","storage not connected":"Upstash Redis ulanmagan (Vercel → Storage)"};
async function load(){try{const j=await api({action:"list"});$("#msg").textContent="";$("#app").hidden=false;$("#lf").hidden=true;sessionStorage.setItem("hak",JSON.stringify(A));
 $("#unused").innerHTML=j.unused.map(u=>`<tr><td><code>${esc(u.code)}</code></td><td>${u.plan}</td><td>${dl(u.days)}</td><td><button class="x" data-del="${esc(u.code)}">✕</button></td></tr>`).join("")||"<tr><td class=muted>Yo'q</td></tr>";
 $("#log").innerHTML=j.log.map(l=>`<tr><td>${dt(l.t)}</td><td>${esc(l.email)}</td><td>${l.plan}</td><td>${dl(l.days)}</td><td class=muted>${esc(l.code)}</td></tr>`).join("")||"<tr><td class=muted>Hali yo'q</td></tr>";
}catch(e){$("#app").hidden=true;$("#lf").hidden=false;sessionStorage.removeItem("hak");$("#msg").textContent=ERR[e.message]||"Xato: "+e.message}}
$("#lf").onsubmit=e=>{e.preventDefault();A={user:$("#user").value.trim(),me:$("#mail").value.trim(),key:$("#key").value};load()};
$("#out2").onclick=()=>{sessionStorage.removeItem("hak");location.reload()};
$("#make").onclick=async()=>{try{const j=await api({action:"create",plan:$("#plan").value,days:$("#days").value,n:$("#n").value});
 $("#out").innerHTML=j.codes.map(c=>`<div class="row" style="margin:4px 0"><code>${c}</code><button data-copy="${c}">Nusxa</button></div>`).join("");load()}catch(e){$("#out").textContent="Xato: "+(ERR[e.message]||e.message)}};
$("#revBtn").onclick=async()=>{if(!confirm("Rostdan bekor qilinsinmi?"))return;try{await api({action:"revoke",email:$("#rev").value});$("#rev").value="";alert("Bekor qilindi")}catch(e){alert(e.message)}};
document.addEventListener("click",async e=>{const c=e.target.dataset.copy,d=e.target.dataset.del;
 if(c){navigator.clipboard.writeText(c);e.target.textContent="✓"}
 if(d&&confirm(d+" o'chirilsinmi?")){await api({action:"delcode",code:d});load()}});
if(A)load();
</script></body></html>
